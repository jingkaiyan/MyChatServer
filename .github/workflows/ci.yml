# 该工作流在每次推送或拉取请求时运行，构建服务器和客户端二进制文件，并在特定分支上上传构建产物以供后续使用。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libmysqlclient-dev \
            libhiredis-dev \
            qtbase5-dev \
            qtbase5-dev-tools
          sudo apt-get install -y libmuduo-dev || echo "libmuduo-dev unavailable, ChatServer may be skipped"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SERVER=ON \
            -DBUILD_CLIENT=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Verify binaries
        run: |
          test -x bin/ChatClient
          if [[ -x bin/ChatServer ]]; then
            echo "ChatServer built successfully"
          else
            echo "ChatServer not found (likely skipped because muduo deps are unavailable in runner)"
          fi

      - name: Upload binaries (selected push branches)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'chore/enterprise-cleanup-and-sync')
        uses: actions/upload-artifact@v4
        with:
          name: mychat-bin-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/ChatServer
            bin/ChatClient
